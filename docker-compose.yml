services:
  api:
    build:
      context: .
      target: ${BUILD_TARGET:-production}
      args:
        - NODE_ENV=${NODE_ENV:-production}
    container_name: node_api_app
    restart: always
    ports:
      - "${PORT:-3800}:${PORT:-3800}"
    env_file: .env
    environment:
      # Variables generales (desarrollo y producción)
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL
      - DIRECT_URL
      - REDIS_URL=${REDIS_URL}
      - REDIS_ENABLED=true
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # Cloudflare R2
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}

      # New Relic (opcional en desarrollo)
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_ENABLED=${NEW_RELIC_ENABLED:-true}
      - NEW_RELIC_LOG_LEVEL=${NEW_RELIC_LOG_LEVEL}
      - NEW_RELIC_NO_CONFIG_FILE=true
      - NEW_RELIC_ATTRIBUTES_INCLUDE="utils.prisma.*"
      - NEW_RELIC_APPLICATION_LOGGING_ENABLED=true
      - NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED=true
      - NEW_RELIC_APPLICATION_LOGGING_METRICS_ENABLED=true
      - NEW_RELIC_PRISMA_ENABLED=true
      - NEW_RELIC_TRANSACTION_TRACER_RECORD_SQL="obfuscated"
    # Los volúmenes para desarrollo se definen en docker-compose.override.yml
    # En producción, el código viene empaquetado en la imagen Docker
    networks:
      - coolify

  db:
    image: postgres:15-alpine
    profiles: [ "local-services" ] # 👈 Solo inicia si se pide explícitamente
    container_name: postgres_db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: America/Lima
      PGTZ: America/Lima
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coolify

  redis:
    image: redis:alpine
    profiles: [ "local-services" ] # 👈 Solo inicia si se pide explícitamente
    container_name: redis_cache
    ports:
      - "6377:6380"
    volumes:
      - redis_data:/data
    networks:
      - coolify

volumes:
  postgres_data:
  redis_data:

    # 2. ESTO DEFINE LA RED (Fuera de services)
networks:
  coolify:
    external: true
